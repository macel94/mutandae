apiVersion: apps/v1
kind: Deployment
metadata:
  name: mutandae
  labels:
    app.kubernetes.io/name: mutandae
    belacca.com/project: mutandae
    belacca.com/stage: native-production
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mutandae
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mutandae
        belacca.com/project: mutandae
        belacca.com/stage: native-production
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mutandae
          image: mutandae
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
