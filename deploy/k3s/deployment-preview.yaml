apiVersion: apps/v1
kind: Deployment
metadata:
  name: mutandae-preview
  labels:
    app.kubernetes.io/name: mutandae-preview
    belacca.com/project: mutandae
    belacca.com/stage: preview
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mutandae-preview
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mutandae-preview
        belacca.com/project: mutandae
        belacca.com/stage: preview
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mutandae
          image: mutandae
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: MUTANDAE_ENVIRONMENT
              value: preview
            - name: MUTANDAE_TENANT
              value: mutandae-preview-synthetic
            - name: MUTANDAE_AWS_ACCOUNT
              value: "123456789012"
            - name: MUTANDAE_AWS_REGION
              value: us-east-1
            - name: MUTANDAE_GCP_PROJECT
              value: mutandae-preview-demo
            - name: MUTANDAE_GCP_REGION
              value: us-central1
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: mutandae-redis-auth
                  key: REDIS_URL
            - name: AWS_ACCOUNT_ID
              valueFrom:
                secretKeyRef:
                  name: mutandae-provider-credentials
                  key: AWS_ACCOUNT_ID
            - name: AWS_REGION
              valueFrom:
                secretKeyRef:
                  name: mutandae-provider-credentials
                  key: AWS_REGION
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: mutandae-provider-credentials
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: mutandae-provider-credentials
                  key: AWS_SECRET_ACCESS_KEY
            - name: GCP_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: mutandae-provider-credentials
                  key: GCP_PROJECT_ID
            - name: GCP_REGION
              valueFrom:
                secretKeyRef:
                  name: mutandae-provider-credentials
                  key: GCP_REGION
            - name: GCP_SERVICE_ACCOUNT_KEY_JSON
              valueFrom:
                secretKeyRef:
                  name: mutandae-provider-credentials
                  key: GCP_SERVICE_ACCOUNT_KEY_JSON
            - name: AZURE_TENANT_ID
              valueFrom:
                secretKeyRef:
                  name: mutandae-provider-credentials
                  key: AZURE_TENANT_ID
            - name: AZURE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: mutandae-provider-credentials
                  key: AZURE_CLIENT_ID
            - name: AZURE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mutandae-provider-credentials
                  key: AZURE_CLIENT_SECRET
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
          startupProbe:
            httpGet:
              path: /readyz
              port: http
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
