name: Test and publish Mutandae

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci.yml'
      - 'cmd/**'
      - 'internal/**'
      - 'deploy/**'
      - 'Dockerfile'
      - '.dockerignore'
      - 'go.mod'
      - 'docs/**'
      - 'scripts/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: mutandae-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Validate Mutandae
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l $(find . -type f -name '*.go' -not -path './vendor/*'))"

      - name: Run tests with race detection
        run: go test -race ./...

      - name: Run static checks
        run: go vet ./...

      - name: Build application
        run: go build -trimpath -ldflags='-s -w' ./cmd/mutandae

      - name: Build container
        run: docker build --tag mutandae:test .

      - name: Test vulnerability decision contract
        run: node --test scripts/create-vulnerability-decision.test.mjs

  publish:
    name: Publish immutable image
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'deploy: publish image') }}"
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      packages: write
      id-token: write
    env:
      COSIGN_EXPERIMENTAL: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and publish
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/macel94/mutandae:sha-${{ github.sha }}
            ghcr.io/macel94/mutandae:latest
          provenance: false
          sbom: false
          cache-from: type=gha,scope=mutandae-image
          cache-to: type=gha,mode=max,scope=mutandae-image

      - name: Set immutable image identity
        id: image
        env:
          IMAGE_NAME: ghcr.io/macel94/mutandae
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "reference=${IMAGE_NAME}@${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "digest=${IMAGE_DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Scan the pushed image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.reference }}
          format: json
          output: mutandae.trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          scanners: vuln
          exit-code: '0'

      - name: Create vulnerability decision
        env:
          IMAGE_NAME: ghcr.io/macel94/mutandae
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          node scripts/create-vulnerability-decision.mjs \
            --input mutandae.trivy.json \
            --output mutandae.vulnerability-decision.json \
            --image "$IMAGE_NAME" \
            --digest "$IMAGE_DIGEST"
          node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            const decision = JSON.parse(await readFile("mutandae.vulnerability-decision.json", "utf8"));
            if (["HIGH", "CRITICAL"].includes(decision.maxSeverity) || decision.knownUnfixed) {
              throw new Error(`native-production-v1 promotion blocked: maxUnfixedSeverity=${decision.maxSeverity}, maxObservedSeverity=${decision.maxObservedSeverity}, knownUnfixed=${decision.knownUnfixed}`);
            }
          '

      - name: Generate registry SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ steps.image.outputs.reference }}
          format: cyclonedx-json
          output-file: mutandae.sbom.cdx.json
          upload-artifact: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create SLSA provenance predicate
        env:
          IMAGE_NAME: ghcr.io/macel94/mutandae
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          digest="${IMAGE_DIGEST#sha256:}"
          cat > mutandae.provenance.json <<EOF
          {
            "_type": "https://in-toto.io/Statement/v1",
            "subject": [{"name": "${IMAGE_NAME}", "digest": {"sha256": "${digest}"}}],
            "predicateType": "https://slsa.dev/provenance/v1",
            "predicate": {
              "buildDefinition": {
                "buildType": "https://actions.github.io/buildtypes/workflow/v1",
                "externalParameters": {
                  "workflow": {
                    "ref": "${GITHUB_REF}",
                    "repository": "https://github.com/${GITHUB_REPOSITORY}",
                    "path": ".github/workflows/ci.yml"
                  }
                },
                "resolvedDependencies": [{
                  "uri": "git+https://github.com/${GITHUB_REPOSITORY}@${GITHUB_SHA}",
                  "digest": {"sha1": "${GITHUB_SHA}"}
                }]
              },
              "runDetails": {
                "builder": {"id": "https://github.com/actions/runner"},
                "metadata": {
                  "invocationId": "https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
                }
              }
            }
          }
          EOF

      - name: Attest image provenance with Cosign
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: cosign attest --yes --predicate mutandae.provenance.json --type https://slsa.dev/provenance/v1 "$IMAGE"

      - name: Attest image SBOM with Cosign
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: cosign attest --yes --predicate mutandae.sbom.cdx.json --type cyclonedx "$IMAGE"

      - name: Attest native production vulnerability decision with Cosign
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
        run: cosign attest --yes --predicate mutandae.vulnerability-decision.json --type https://belacca.com/attestations/vulnerability/v1 "$IMAGE"

      - name: Record deployed immutable image
        shell: bash
        env:
          IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA}"
          sed -i -E "s#(    newTag: ).*#\1${tag}#" deploy/k3s/kustomization.yaml
          if grep -q '^    digest:' deploy/k3s/kustomization.yaml; then
            sed -i -E "s#(    digest: ).*#\1${IMAGE_DIGEST}#" deploy/k3s/kustomization.yaml
          else
            sed -i "/^    newTag:/a\    digest: ${IMAGE_DIGEST}" deploy/k3s/kustomization.yaml
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add deploy/k3s/kustomization.yaml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "deploy: publish image ${tag}"
          git push
