{{ define "new-identity" }}
<form class="new-identity" autocomplete="off" hx-post="/identities/provision" hx-target="#{{ .Target }}" hx-swap="innerHTML" hx-disabled-elt="find button, find select">
  <span class="new-identity-label">Identity type</span>
  <select class="new-identity-select" name="provider" aria-label="Identity type">
    {{ range .Providers }}<option value="{{ .Kind }}">{{ .Label }}</option>{{ end }}
  </select>
  <button class="button button-primary" type="submit"><span class="button-icon">+</span> New identity</button>
</form>
{{ end }}
